# このファイルは、MoveItのPlanningSceneMonitorが3Dセンサーを認識し、
# OctoMapを生成するために使用するパラメータを定義します。

# 1. OctoMap自体の基本設定
#    これらのパラメータは、OccupancyMapMonitorの初期化に必要です。
#    ログで警告されていた 'Resolution not specified' を解決します。
octomap_frame: world
octomap_resolution: 0.05

# 2. 使用するセンサープラグインのリスト
#    MoveItに、どのセンサー設定を読み込むかを指示します。
sensors:
  - zed_camera_pointcloud
 
# 3. 各センサープラグインの詳細設定
#    上でリストしたセンサー名 ('zed_camera_pointcloud') をキーとして、
#    具体的な設定を記述します。
zed_camera_pointcloud:
  # 使用するセンサープラグインを指定します。
  # PointCloud2メッセージを処理する場合はPointCloudOctomapUpdaterを使用します。
  sensor_plugin: "occupancy_map_monitor/PointCloudOctomapUpdater"
  # 購読するPointCloud2トピックの名前。
  # zed_wrapperのデフォルトトピックに合わせています。
  point_cloud_topic: "/point_cloud/filtered" # "/zed2i/zed_node/point_cloud/cloud_registered"
  # センサーの最大検知範囲（メートル）。これより遠い点は無視されます。
  max_range: 2.0
  # ポイントの間引き率。1は全て使用、2は1つおき、などを意味します。
  point_subsample: 1
  # OctoMap内の障害物の周囲に追加するパディング（メートル）。
  padding_offset: 0.03
  # パディングのスケーリング係数。
  padding_scale: 1.0
  # OctoMapの最大更新レート（Hz）。
  max_update_rate: 1.0
  # （デバッグ用）セルフフィルタリング後の点群をパブリッシュするトピック名。
  filtered_cloud_topic: "filtered_octomap_cloud"
